name: AFP-GIC Automatic Code Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install test dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Check Python syntax
        run: python -m compileall -q training public_release

      - name: Test training workflow and configurations
        run: python training/tests/test_workflow.py
